name: CI - viapp Protocol

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-stellar-contracts:
    name: Stellar Smart Contracts (Rust & wasm32v1-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (wasm32v1-none)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts/stellar -> target

      - name: Run Soroban Contract Unit & Auth-Tree Tests
        working-directory: packages/contracts/stellar
        run: cargo test --verbose

      - name: Verify wasm32v1-none Release Compilation
        working-directory: packages/contracts/stellar
        run: cargo rustc --lib --crate-type=cdylib --target=wasm32v1-none --release

  test-typescript:
    name: TypeScript Core, Agent & Web Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Core & Stellar Protocol Test Suites
        run: |
          npx vitest run packages/core/test/bridge.test.ts
          npx vitest run packages/core/test/stocks-stellar.test.ts
          npx vitest run packages/core/test/stellar-client.test.ts
          npx vitest run packages/core/test/gift-stellar.test.ts
          npx vitest run packages/core/test/claim-stellar.test.ts
          npx vitest run packages/core/test/quote-unified.test.ts
          npx vitest run packages/core/test/sep.test.ts
          npx vitest run packages/core/test/fuzz-stellar-claim.test.ts
          npx vitest run packages/core/test/trade-stellar.test.ts
          npx vitest run packages/core/test/mainnet-readiness.test.ts
          npx vitest run packages/agent/test/
          npm run community:check
